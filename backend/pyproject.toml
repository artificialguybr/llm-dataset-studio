[project]
name = "llm-dataset-studio"
version = "0.1.0"
description = "Local-first tooling for text / conversation / LLM datasets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "pyarrow>=25.0.1",
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[tool.setuptools]
packages = { find = { include = ["app*"], exclude = ["data*", "tests*"] } }
package-dir = { "" = "." }

[tool.uv]
package = true